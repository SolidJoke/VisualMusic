name: CI

# Until now nothing ran the checks: the suite was green because someone
# remembered to type `npm test`. That is how a TypeError on every fretboard
# click survived 837 passing tests (see PR #94).

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the previous run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: test · build · lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires ^20.19 || >=22.12. Pinned to the LTS line rather
          # than to whatever is on a developer's machine. Read from `.nvmrc`,
          # which Netlify reads too: one declaration, so the build that ships
          # and the build that is checked cannot run on different Node lines.
          # Do not add `node-version` here — it would silently win over the file.
          node-version-file: '.nvmrc'
          cache: npm

      # `npm ci` installs from the lockfile into a clean tree, so it verifies
      # what the project actually declares — not what happens to be sitting in
      # someone's node_modules.
      - name: Install
        run: npm ci

      # Blocking, unlike lint: the checked set — hooks/, context/, AppDesktop —
      # is at zero errors, so a failure here is always something this PR broke.
      # It is what makes a dropped hook option fail the build instead of
      # surfacing as a TypeError on click.
      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # The offline audio harness (VMU-026). It needs a real browser, because
      # jsdom implements no Web Audio at all and the vitest suite therefore
      # cannot render a single sample. `npm ci` installs the playwright package
      # but no browser binary, so the download is explicit here — without this
      # step the harness would be green on a developer's machine and simply not
      # exist in CI, which is how a harness quietly dies.
      #
      # Blocking, and it renders offline rather than in real time, so it does
      # not depend on the runner's speed. It carries one expected-red check
      # against VMU-020's makeup-gain defect: that does not fail the run, but if
      # it ever passes, the run fails, so the marker cannot outlive the bug.
      - name: Install Chromium for the audio harness
        run: npx playwright install --with-deps chromium

      - name: Audio harness (VMU-026)
        run: npm run audio:check

      # Non-blocking on purpose: there are 68 pre-existing eslint errors.
      # Making it blocking today would mean either a red CI on every PR or a
      # large unrelated cleanup bundled into this one. VMU-011 resorbs them and
      # flips this to blocking.
      #
      # `continue-on-error` was the obvious way to write this and it is a trap:
      # it reports the step as *success*, so the number is buried in the log and
      # nobody would ever look. The count goes to the run summary instead, where
      # a regression is visible without opening anything.
      - name: Lint (non-blocking — see VMU-011)
        run: |
          npm run lint > lint.log 2>&1 || true
          cat lint.log
          {
            echo "### Lint — non-blocking (VMU-011)"
            echo
            echo '```'
            grep -E '[0-9]+ problems' lint.log || echo "clean"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
